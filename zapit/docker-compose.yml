services:
  zapit:
    build: .
    image: zapit:local
    container_name: zapit
    ports:
      - "5150:5150"
    environment:
      PORT: "5150"
      # Set a password so only you can flip the auth switch at /admin.
      # It's hashed and persisted on first boot, so it survives later env changes.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      # Authentik SSO (optional — configure then flip the switch in /admin)
      AUTHENTIK_BASE_URL: "${AUTHENTIK_BASE_URL:-}"
      AUTHENTIK_SLUG: "${AUTHENTIK_SLUG:-zapit}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_SCOPES: "${AUTHENTIK_SCOPES:-openid profile email}"
      # canonical public origin: QR codes + OIDC redirect URIs use this when set
      # (e.g. https://zapp.innotel.us behind a reverse proxy)
      PUBLIC_URL: "${PUBLIC_URL:-}"
      # QR code customization: override the link address the QR code encodes
      # (defaults to the canonical/LAN URL)
      QR_URL: "${QR_URL:-}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      # SecretOps (docs/stack.md): ADMIN_PASSWORD / AUTHENTIK_CLIENT_SECRET
      # may be vault://<mount>/<path>#<key> references resolved at startup.
      VAULT_ADDR: "${VAULT_ADDR:-}"
      VAULT_TOKEN: "${VAULT_TOKEN:-}"
      VAULT_TOKEN_FILE: "${VAULT_TOKEN_FILE:-}"
      VAULT_PREFIX: "${VAULT_PREFIX:-cerulean}"
      VAULT_NAMESPACE: "${VAULT_NAMESPACE:-}"
      VAULT_SKIP_VERIFY: "${VAULT_SKIP_VERIFY:-}"
      VAULT_CACERT: "${VAULT_CACERT:-}"
    volumes:
      # named volume: owned by the container's node user automatically.
      # Prefer a bind mount instead? Use ./data:/data and run: chown 1000:1000 ./data
      - zapit-data:/data
    restart: unless-stopped

volumes:
  zapit-data:
