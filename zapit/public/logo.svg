<svg xmlns="http://www.w3.org/2000/svg" width="480" height="140" viewBox="0 0 480 140" role="img" aria-label="ZAPIT — golden lightning bolt">
  <style>
    .bolt-body { transform-origin: 50% 60%; }
    .spark { opacity: 0; transform-origin: center; transform-box: fill-box; }
    @media (prefers-reduced-motion: no-preference) {
      .bolt-body { animation: pulse 3.2s ease-in-out infinite; }
      .spark { animation: twinkle 3.2s ease-in-out infinite; }
      .s2 { animation-delay: .6s; }
      .s3 { animation-delay: 1.2s; }
      .s4 { animation-delay: 1.9s; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(251,191,36,.4)); }
      50%      { transform: scale(1.05); filter: drop-shadow(0 0 14px rgba(217,119,6,.85)); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(.4); }
      50%      { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <defs>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset=".3" stop-color="#fcd34d"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset=".8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset=".45" stop-color="#fcd34d"/>
      <stop offset=".7" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fff7cc"/>
    </linearGradient>
    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="476" height="136" rx="24" fill="#0b0d10"/>
  <rect x="2.5" y="2.5" width="475" height="135" rx="23.5" fill="none" stroke="#232b36"/>

  <g transform="translate(46,21) scale(1.55)">
    <path class="bolt-body" filter="url(#boltGlow)" fill="url(#boltGrad)" d="M32 2 L4 40 H17 L12 62 L44 24 H29 Z"/>
    <path class="spark s1" d="M7 6 l3 5 -2.5 1 3 5" stroke="#fcd34d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path class="spark s2" d="M42 8 l-3 5 2.5 1 -3 5" stroke="#f59e0b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path class="spark s3" d="M43 42 l-3 4 2.5 1.5 -3 4" stroke="#d97706" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path class="spark s4" d="M4 48 l3 4 -2.5 1.5 3 4" stroke="#fef3c7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <text x="160" y="89" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="54" letter-spacing="14" fill="url(#wordGrad)">ZAPIT</text>
</svg>
