# Production deployment for:
#   * landing: https://zapit.innotel.us
#   * app:     https://zapp.innotel.us
#
# This stack runs both services on the same Docker host. Nginx Proxy Manager
# (NPM) can run on this host or another host and routes by hostname:
#   * zapit.innotel.us -> <app-host>:8080 (landing, WebSockets off)
#   * zapp.innotel.us  -> <app-host>:5150 (ZapIt, WebSockets on)
# NPM owns public ports 80/443 and TLS; these are internal app-host ports.
#
# 1. On the APP host: copy .env.example to .env next to this file and set:
#      ADMIN_PASSWORD=<secret>
#      (Authentik vars only if you use SSO — see README)
#
# 2. DNS: both zapit.innotel.us and zapp.innotel.us must resolve to the NPM host.
#    A wildcard *.innotel.us record already covers both in the innotel setup.
#
# 3. On the APP host, bring up both services:
#      docker compose -f docker-compose.prod.yml up -d
#
# 4. On the NPM host (UI at http://<npm-host>:81) add two proxy hosts:
#      Landing: Domain zapit.innotel.us, Scheme http, Forward Host <app-host LAN IP>, Port 8080
#      App:     Domain zapp.innotel.us, Scheme http, Forward Host <app-host LAN IP>, Port 5150
#      Enable Websockets Support only for the app proxy host.
#      Enable Block Common Exploits and request Let's Encrypt certificates for both.
#
# 5. Apply the Authentik blueprint once (only if you use SSO): open
#    https://zapp.innotel.us/admin -> Download blueprint YAML -> paste into Authentik.
#

services:
  landing:
    build:
      context: ../web/landing
    image: zapit-landing:local
    container_name: zapit-landing
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  zapit:
    build:
      context: ../zapit
    image: zapit:local
    container_name: zapit
    restart: unless-stopped
    ports:
      # published on the app host's LAN address so the remote NPM can reach it
      - "5150:5150"
    environment:
      PORT: "5150"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      PUBLIC_URL: "https://zapp.innotel.us"
      AUTHENTIK_BASE_URL: "${AUTHENTIK_BASE_URL:-}"
      AUTHENTIK_SLUG: "${AUTHENTIK_SLUG:-zapit}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_SCOPES: "${AUTHENTIK_SCOPES:-openid profile email}"
      # QR code customization: override the link address the QR code encodes
      # (defaults to the canonical app URL)
      QR_URL: "${QR_URL:-https://zapp.innotel.us}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
    volumes:
      - zapit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5150/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zapit-data:
