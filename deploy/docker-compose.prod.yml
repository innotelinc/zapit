# Production deployment for https://droppy.innotel.us
# Reverse proxy: Nginx Proxy Manager (NPM) — this compose does NOT publish ports
# or terminate TLS; your existing NPM instance owns 80/443.
#
# 1. Copy .env.example to .env next to this file and set at minimum:
#      ADMIN_PASSWORD=<secret>
#      AUTHENTIK_BASE_URL=https://<your-authentik-host>
#      AUTHENTIK_CLIENT_ID=droppy
#      NPM_NETWORK=<the docker network your NPM container uses>  (see below)
#
#    Find the network:  docker inspect <npm-container> --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}} {{end}}'
#    (commonly "npm_default" or a manually created "proxy" network)
#
# 2. Point DNS for droppy.innotel.us at the host running NPM.
#
# 3. Bring it up:
#      docker compose -f docker-compose.prod.yml up -d
#
# 4. In NPM: Hosts → Proxy Hosts → Add Proxy Host
#      Domain:        droppy.innotel.us
#      Scheme:        http
#      Forward Host:  droppy        (this compose's container name)
#      Port:          5150
#      ✅ Websockets Support        (required — transfers ride WebSockets)
#      ✅ Block Common Exploits
#      SSL tab: Request a new Let's Encrypt certificate, Force SSL, HTTP/2
#
# 5. Apply the Authentik blueprint once: open https://droppy.innotel.us/admin →
#    "Download blueprint YAML" → paste into Authentik (Customize → Blueprints → Create),
#    or mount authentik/blueprint.yaml into the authentik worker as /blueprints/droppy.yaml.
#    client_id must match AUTHENTIK_CLIENT_ID (blueprint default: droppy).
#
# 6. Flip "Require Authentik login" in /admin when ready.
#
# Note: pulling ghcr.io/innotelinc/droppy requires the GHCR package to be public
# (repo → Packages → droppy → Package settings) or a `docker login ghcr.io` with a
# package-scoped token.

services:
  droppy:
    image: ghcr.io/innotelinc/droppy:latest
    container_name: droppy
    restart: unless-stopped
    environment:
      PORT: "5150"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      PUBLIC_URL: "https://droppy.innotel.us"
      AUTHENTIK_BASE_URL: "${AUTHENTIK_BASE_URL:-}"
      AUTHENTIK_SLUG: "${AUTHENTIK_SLUG:-droppy}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_SCOPES: "${AUTHENTIK_SCOPES:-openid profile email}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
    volumes:
      - droppy-data:/data
    networks:
      - npm-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5150/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Direct LAN access without going through NPM? Uncomment:
    # ports:
    #   - "5150:5150"

networks:
  npm-proxy:
    external: true
    name: "${NPM_NETWORK:?set NPM_NETWORK in .env}"

volumes:
  droppy-data:
